name: Deploy to Coolify

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Backend (Spring Boot / Maven)
        run: |
          cd backend/tcc-backend
          mvn clean package -DskipTests

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/transportadora-frontend/package-lock.json

      - name: Build Frontend (Angular)
        run: |
          cd frontend/transportadora-frontend
          npm ci --legacy-peer-deps
          npm run build

  deploy:
    name: Trigger Coolify Deploy
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Disparar Deploy no Coolify
        run: |
          if [ -z "${{ secrets.COOLIFY_WEBHOOK }}" ]; then
            echo "❌ ERRO: O segredo COOLIFY_WEBHOOK não foi configurado nos Secrets do GitHub."
            echo "Acesse Settings -> Secrets and variables -> Actions e adicione COOLIFY_WEBHOOK."
            exit 1
          fi

          echo "🚀 Disparando webhook no Coolify..."
          if [ -n "${{ secrets.COOLIFY_TOKEN }}" ]; then
            curl -f -X GET "${{ secrets.COOLIFY_WEBHOOK }}" \
              -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"
          else
            curl -f -X GET "${{ secrets.COOLIFY_WEBHOOK }}"
          fi
          echo "✅ Deploy disparado com sucesso no Coolify!"
