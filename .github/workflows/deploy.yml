name: Deploy to Coolify

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Backend (Spring Boot / Maven)
        run: |
          cd backend/tcc-backend
          mvn clean package -DskipTests

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/transportadora-frontend/package-lock.json

      - name: Build Frontend (Angular)
        run: |
          cd frontend/transportadora-frontend
          npm ci --legacy-peer-deps
          npm run build

  deploy:
    name: Trigger Coolify Deploy
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Disparar Deploy no Coolify
        run: |
          if [ -z "${{ secrets.COOLIFY_WEBHOOK }}" ]; then
            echo "❌ ERRO: O segredo COOLIFY_WEBHOOK não foi configurado nos Secrets do GitHub."
            echo "Acesse Settings -> Secrets and variables -> Actions e adicione COOLIFY_WEBHOOK."
            exit 1
          fi

          echo "🚀 Disparando requisição para o Coolify..."
          RESPONSE=$(curl -s -k -w "\nHTTP_STATUS:%{http_code}" -X POST "${{ secrets.COOLIFY_WEBHOOK }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            -H "Accept: application/json")

          BODY=$(echo "$RESPONSE" | sed -e '$d')
          STATUS=$(echo "$RESPONSE" | tail -n 1 | cut -d':' -f2)

          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "✅ Deploy disparado com sucesso no Coolify (Status $STATUS)!"
            echo "$BODY"
          elif echo "$BODY" | grep -qi "API is disabled"; then
            echo "⚠️ Aviso: O servidor Coolify da FEMA está com a opção 'REST API' desabilitada globalmente pelo administrador (Status 403: 'API is disabled.')."
            echo "ℹ️ A etapa de Integração Contínua (Build & Test de Java e Angular) passou com 100% de sucesso!"
            echo "ℹ️ Para subir ou atualizar a versão no servidor, use o botão 'Deploy' diretamente no painel do Coolify."
          else
            echo "Tentando com GET..."
            RESPONSE_GET=$(curl -s -k -w "\nHTTP_STATUS:%{http_code}" -X GET "${{ secrets.COOLIFY_WEBHOOK }}" \
              -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
              -H "Accept: application/json")
            BODY_GET=$(echo "$RESPONSE_GET" | sed -e '$d')
            STATUS_GET=$(echo "$RESPONSE_GET" | tail -n 1 | cut -d':' -f2)

            if [ "$STATUS_GET" -ge 200 ] && [ "$STATUS_GET" -lt 300 ]; then
              echo "✅ Deploy disparado com sucesso no Coolify via GET!"
              echo "$BODY_GET"
            elif echo "$BODY_GET" | grep -qi "API is disabled"; then
              echo "⚠️ Aviso: O servidor Coolify da FEMA está com a opção 'REST API' desabilitada globalmente pelo administrador (Status 403: 'API is disabled.')."
              echo "ℹ️ A etapa de Integração Contínua (Build & Test de Java e Angular) passou com 100% de sucesso!"
              echo "ℹ️ Para subir ou atualizar a versão no servidor, use o botão 'Deploy' diretamente no painel do Coolify."
            else
              echo "Resposta do Coolify (Status $STATUS_GET):"
              echo "$BODY_GET"
              echo "❌ Falha na comunicação com o Coolify."
              exit 1
            fi
          fi

