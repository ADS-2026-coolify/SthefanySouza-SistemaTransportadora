version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: transportadora-db
    restart: always
    environment:
      POSTGRES_DB: transportadora_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d transportadora_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - transportadora-net

  backend:
    build:
      context: ./backend/tcc-backend
      dockerfile: Dockerfile
    container_name: transportadora-backend
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/transportadora_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - transportadora-net

  frontend:
    build:
      context: ./frontend/transportadora-frontend
      dockerfile: Dockerfile
    container_name: transportadora-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - transportadora-net

volumes:
  postgres_data:

networks:
  transportadora-net:
    driver: bridge
